name: FinClaro backend CI

on:
  push:
    branches:
      - finclaro-backend-1.0
  pull_request:
    branches:
      - finclaro-backend-1.0

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check server.js
      - run: node --check src/ai/parser.js
      - run: node --check src/services/assistant.js
