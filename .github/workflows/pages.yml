name: Deploy FinClaro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Regenerate sitemap
        run: python3 generate-sitemap.py
      - name: Inject consent script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '<script src="/consent.js"></script>'
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'consent.js' in text or '</head>' not in text.lower():
                  continue
              i = text.lower().index('</head>')
              text = text[:i] + tag + '\n' + text[i:]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
