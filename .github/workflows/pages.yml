name: Deploy FinClaro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: generate-sitemap.py usa `git log -1` por fichero
          # para el lastmod. Con fetch-depth 1 todas las fechas caen en hoy.
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Regenerate sitemap
        run: python3 generate-sitemap.py
      - name: Inject consent and AdSense tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          consent = '<script src="/consent.js"></script>'
          adsense = ('<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2993676855543434" '
                     'crossorigin="anonymous"></script>')
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              low = text.lower()
              if '</head>' not in low:
                  continue
              # consent.js primero: fija Consent Mode en "denied" antes de AdSense.
              if 'consent.js' not in text:
                  i = low.index('<head>') + len('<head>')
                  text = text[:i] + '\n  ' + consent + text[i:]
                  low = text.lower()
              # Etiqueta estatica de AdSense: Googlebot la ve sin aceptar cookies.
              if 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' not in text:
                  i = low.index('</head>')
                  text = text[:i] + adsense + '\n' + text[i:]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
