name: Deploy FinClaro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Add Google Analytics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-ECDR680DVZ"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-ECDR680DVZ');
          </script>'''
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'G-ECDR680DVZ' not in text and '</head>' in text.lower():
                  i = text.lower().index('</head>')
                  text = text[:i] + tag + '\\n' + text[i:]
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
